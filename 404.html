<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>READER</title>
  <script>
    // SPA 라우팅을 위한 gh-pages 리다이렉트 처리
    var l = window.location;
    l.replace(
      l.protocol + '//' + l.host + l.pathname.split('/').slice(0, 1 + 1).join('/') +
      '/?/' + l.pathname.slice(1) + l.search + l.hash
    );
  </script>
</head>
<body></body>
</html>
